[project]
name = "voice-agent"
version = "0.1.0"
description = "Voice agent: FastAPI service and LangGraph agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.8",
    "anthropic>=0.75.0",
    "langchain-anthropic>=1.0.0",
    "langchain-core>=0.3.34",
    "langgraph>=0.2.70",
    "pydantic-settings>=2.7.1",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.3",
    "pydantic>=2.10.6",
    "uvicorn>=0.34.3",
    "tiktoken>=0.8.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pyright==1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_agent"]

# --- Coverage ---------------------------------------------------------------
# scripts/ci/python-checks.sh measures coverage when this section exists and
# fails under the floor. Raise the floor as coverage grows; never lower it.

[tool.coverage.run]
# Next to the other tool caches at the repo root, not inside the agent.
data_file = "../../.coverage"
source = ["voice_agent"]
branch = true

[tool.coverage.report]
# Raise the floor as coverage grows; never lower it.
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
