# The voice agent API: its own compose project.
# Usually driven by `make -C agents/voice_agent docker-up`. Directly, from the
# repo root:
#   docker compose -f infra/docker-compose.backend.yml up -d --build
#
# This project creates the `voiceagent-net` network the web app joins.
name: voiceagent-agents

services:
  voice-agent-api:
    build:
      context: ..
      dockerfile: agents/voice_agent/Dockerfile
    image: voiceagent/voice-agent:local
    container_name: voiceagent-voice-agent-api
    restart: unless-stopped
    # The agent's own settings (API keys, models).
    env_file: ../agents/voice_agent/.env
    environment:
      # The .env is written for local development (autoreload, console logs); the
      # container always runs the production server settings.
      RELOAD: "false"
      LOG_JSON: "true"
      ENVIRONMENT: production
      # Trust X-Forwarded-For from nginx so rate limits see the real client.
      # Safe because the port below is bound to localhost: only nginx (on the
      # compose network) and this machine can reach the agent directly.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:${VOICE_AGENT_PORT:-8000}:8000"

networks:
  default:
    name: voiceagent-net
