[project]
name = "voice-agent"
version = "0.1.0"
description = "Sunrise Hospitals patient assistant: FastAPI, Claude and Vartaloop TTS"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.8",
    "anthropic>=2.14.0",
    "pydantic-settings>=2.7.1",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.3",
    "pydantic>=2.14.4",
    "uvicorn>=0.34.3",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_agent"]

# --- Coverage ---------------------------------------------------------------
# scripts/ci/python-checks.sh measures coverage when this section exists and
# fails under the floor. Raise the floor as coverage grows; never lower it.

[tool.coverage.run]
# Next to the other tool caches at the repo root, not inside the agent.
data_file = "../../.coverage"
source = ["voice_agent"]
branch = true

[tool.coverage.report]
# Raise the floor as coverage grows; never lower it.
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
